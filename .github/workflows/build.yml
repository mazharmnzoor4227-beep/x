name: Release Build (X v1.0)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # New series: Gradle from setup-gradle (8.11.1, same as gradle-wrapper.properties),
      # NOT ./gradlew — gradle-wrapper.jar cannot travel via snapshot push (binary).
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
      - name: Install SDK packages
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      # NOTE: this workflow does NOT run unit tests. Tests are gated by
      # verify-targeted.yml, which runs on the same push (31 classes; the 3
      # known pre-existing failures — EnglishUiTest, V03ScreensTest,
      # V053AuthStorageTest — are fixed separately). The full suite hangs
      # pre-existing (V053), so it cannot gate a release build. This matches
      # how the v0.9.4 APK was built (no test step in that run).
      - name: Assemble release (unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: x-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
# X v1.0 first release: 24-agent roster, 30 skill packs, Sand theme (unit tests are gated by verify-targeted.yml on the same push)
