# Targeted verification for the v0.9.4 composer fix (one-off, not the full suite).
# The full suite hangs on CI after V053AuthStorageTest (46 min of silence, no output),
# so the disputed items are checked here instead, one class at a time with a hard
# per-class timeout so a hanging class is named instead of stalling the whole run:
#  - EnglishUiTest + V052SpeedBugTest: the two failures outside the known legacy set
#  - the 11 classes the full run never reached
#  - P0 roadmap tests (axion-roadmap-p0): the new/changed unit tests from the audit roadmap
# Run this on BOTH the fix branch and the release-0.9.3 baseline and compare.
# Honest gates (P0-13): no `|| true` hides a failure. Every failing class is recorded
# in the job summary and fails the job at the end (after all classes have run).
name: Verify Targeted (X v1.0)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # New series: Gradle from setup-gradle (8.11.1, same as gradle-wrapper.properties),
      # NOT gradle — gradle-wrapper.jar cannot travel via snapshot push (binary).
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
      - name: Install SDK packages
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort | tail -1)
          yes | $SDKM --licenses > /dev/null 2>&1 || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.3.11579264"
      - name: Disputed failures
        run: |
          gradle testDebugUnitTest --no-daemon --stacktrace --tests "com.mazharansari.x.EnglishUiTest" --tests "com.mazharansari.x.V052SpeedBugTest" || { echo "FAILED: Disputed failures (EnglishUiTest / V052SpeedBugTest)" >> $GITHUB_STEP_SUMMARY; echo "AXION_CI_FAILED=1" >> $GITHUB_ENV; }
      - name: Legacy composer UI classes (V03 is the composer area this fix touches)
        run: |
          gradle testDebugUnitTest --no-daemon --stacktrace --tests "com.mazharansari.x.V03ScreensTest" --tests "com.mazharansari.x.V053AuthStorageTest" || { echo "FAILED: Legacy composer UI classes (V03ScreensTest / V053AuthStorageTest)" >> $GITHUB_STEP_SUMMARY; echo "AXION_CI_FAILED=1" >> $GITHUB_ENV; }
      - name: Unrun classes, one by one
        run: |
          # Six of these live in subpackages, not top-level com.mazharansari.x —
          # list them by fully-qualified name (the --tests filter is exact).
          for c in com.mazharansari.x.build.ChangeGateTest com.mazharansari.x.agent.CommandStatusTest com.mazharansari.x.agent.FaultToleranceTest com.mazharansari.x.agent.HistoryCompressionTest com.mazharansari.x.agent.PlanningTest com.mazharansari.x.V05LogicTest com.mazharansari.x.V05ScreensTest com.mazharansari.x.V06ScreensTest com.mazharansari.x.agent.VideoCommandTest com.mazharansari.x.VoiceLogicTest com.mazharansari.x.VoiceSelectionTest; do
            echo "===== CLASS $c ====="
            timeout 480 gradle testDebugUnitTest --no-daemon --tests "$c" || { echo "FAILED: $c (exit $?)" >> $GITHUB_STEP_SUMMARY; echo "AXION_CI_FAILED=1" >> $GITHUB_ENV; }
          done
      - name: P0 roadmap tests, one by one
        run: |
          for c in ProjectVerifierTest P0RoadmapTest P0RoadmapVmTest TarExtractSecurityTest ScheduleAnchorTest ScheduledRunDecisionTest ApprovalGateTest SecretScannerTest AppUpdateTest ToolsLibraryTest; do
            echo "===== CLASS $c ====="
            timeout 480 gradle testDebugUnitTest --no-daemon --tests "com.mazharansari.x.$c" || { echo "FAILED: $c (exit $?)" >> $GITHUB_STEP_SUMMARY; echo "AXION_CI_FAILED=1" >> $GITHUB_ENV; }
          done
      - name: P1 roadmap tests, one by one
        run: |
          for c in P1GitHubTest P1McpTest P1RoadmapTest SwarmOrchestratorTest P1TurboTest P1ReleaseSigningTest BrowserTabsTest BrowserDownloadsTest RetryPolicyTest RunCheckpointTest ScheduledRunDecisionV2Test P1QuotaTokensTest P1VoiceHedgeTest; do
            echo "===== CLASS $c ====="
            timeout 480 gradle testDebugUnitTest --no-daemon --tests "com.mazharansari.x.$c" || { echo "FAILED: $c (exit $?)" >> $GITHUB_STEP_SUMMARY; echo "AXION_CI_FAILED=1" >> $GITHUB_ENV; }
          done
      - name: P2 roadmap tests, one by one
        run: |
          # P2SessionTest is com.mazharansari.x.agent, P2JobsTest is
          # com.mazharansari.x.data — fully-qualified names (see above).
          for c in com.mazharansari.x.agent.P2SessionTest com.mazharansari.x.data.P2JobsTest com.mazharansari.x.P2LocalToolUseTest com.mazharansari.x.P2BuildDemoTest com.mazharansari.x.P2CustomVoiceTest com.mazharansari.x.P2AgyNextRunTest com.mazharansari.x.P2StatusServerTest com.mazharansari.x.P2PluginApiTest com.mazharansari.x.P2TelegramTest com.mazharansari.x.P2DigestTest; do
            echo "===== CLASS $c ====="
            timeout 480 gradle testDebugUnitTest --no-daemon --tests "$c" || { echo "FAILED: $c (exit $?)" >> $GITHUB_STEP_SUMMARY; echo "AXION_CI_FAILED=1" >> $GITHUB_ENV; }
          done
      - name: Fail job if any class failed
        if: always()
        run: |
          if [ "$AXION_CI_FAILED" = "1" ]; then echo "One or more test classes failed (see summary above)." >> $GITHUB_STEP_SUMMARY; exit 1; fi
          echo "All test classes passed." >> $GITHUB_STEP_SUMMARY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-targeted
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
